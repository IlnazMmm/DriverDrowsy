[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "drowsy-preprocessing"
version = "1.0.0"
description = "Timestamp-aware video feature extraction research baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyarrow>=15",
]

[project.optional-dependencies]
test = ["jsonschema>=4.21", "pytest>=8.0"]

[project.scripts]
drowsy-preprocessing = "drowsy_preprocessing.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/drowsy_preprocessing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
